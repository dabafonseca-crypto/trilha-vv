
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c2b">
<title>TRILHA VV | Desenvolvimento de Pessoas</title>

<style>
:root {
  --navy: #101c2b;
  --navy2: #17283b;
  --green: #18a879;
  --green-light: #e7f7f0;
  --bg: #f4f7fa;
  --white: #ffffff;
  --text: #263548;
  --muted: #788797;
  --border: #e6ebf0;
  --orange: #e9a23b;
  --red: #d9534f;
  --radius: 15px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
}

.sidebar {
  width: 245px;
  background: var(--navy);
  color: white;
  padding: 25px 16px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 8px 35px;
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--green);
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 900;
}

.brand strong {
  font-size: 17px;
  letter-spacing: 1px;
}

.brand small {
  display: block;
  color: #aab8c6;
  font-size: 10px;
  margin-top: 4px;
}

.nav-label {
  color: #8294a7;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 0 12px;
  margin: 12px 0;
}

.nav-btn {
  border: 0;
  color: #bdc9d5;
  background: transparent;
  padding: 13px 12px;
  border-radius: 10px;
  text-align: left;
  margin-bottom: 5px;
  font-size: 13px;
  transition: .2s;
}

.nav-btn:hover,
.nav-btn.active {
  background: #263c50;
  color: white;
}

.nav-btn.active {
  border-left: 3px solid var(--green);
}

.side-footer {
  margin-top: auto;
  padding: 15px 10px;
  color: #9eacb9;
  font-size: 11px;
  line-height: 1.7;
  border-top: 1px solid #2a3b4c;
}

.workspace {
  flex: 1;
  min-width: 0;
}

.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 20px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.eyebrow {
  color: var(--green);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 10px;
  font-weight: 800;
}

.topbar h1 {
  font-size: 23px;
  margin-top: 5px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.top-actions select {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  max-width: 190px;
  background: white;
  color: var(--text);
}

.avatar {
  background: var(--green-light);
  color: var(--green);
  width: 39px;
  height: 39px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
}

main {
  max-width: 1350px;
  padding: 30px;
  margin: auto;
}

.welcome {
  background: linear-gradient(115deg, #122438, #24435a);
  color: white;
  padding: 30px;
  border-radius: var(--radius);
  margin-bottom: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.welcome h2 {
  font-size: 25px;
  margin-bottom: 10px;
}

.welcome p {
  color: #c2d0dc;
  font-size: 13px;
  line-height: 1.6;
}

.welcome-mark {
  font-size: 58px;
  opacity: .8;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 25px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 18px;
}

.stat-card {
  padding: 19px;
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
}

.stat-number {
  font-size: 29px;
  font-weight: 800;
  margin: 12px 0 5px;
}

.stat-description {
  color: var(--muted);
  font-size: 11px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 25px 0 15px;
}

.section-title h2 {
  font-size: 17px;
}

.section-title p {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: #edf1f4;
  border-radius: 20px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 20px;
}

.employee-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.employee-row:last-child {
  border-bottom: 0;
}

.employee-avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #eaf0f6;
  color: #42617e;
  display: grid;
  place-items: center;
  font-weight: 800;
}

.employee-info {
  flex: 1;
  min-width: 0;
}

.employee-info strong {
  display: block;
  font-size: 13px;
}

.employee-info small {
  color: var(--muted);
  font-size: 11px;
}

.employee-progress {
  width: 110px;
  font-size: 11px;
  color: var(--muted);
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.module-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}

.module-icon {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--green-light);
  font-size: 21px;
  margin-bottom: 15px;
}

.module-card h3 {
  font-size: 15px;
  margin-bottom: 8px;
}

.module-card p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  min-height: 40px;
}

.module-meta {
  display: flex;
  justify-content: space-between;
  margin: 15px 0;
  font-size: 11px;
  color: var(--muted);
}

.tag {
  display: inline-block;
  background: var(--green-light);
  color: #16835f;
  border-radius: 30px;
  padding: 5px 9px;
  font-size: 10px;
  font-weight: 700;
}

.tag.pending {
  background: #fff3df;
  color: #ad7622;
}

.btn {
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 12px;
  font-weight: 700;
  background: var(--green);
  color: white;
}

.btn:hover {
  filter: brightness(.95);
}

.btn-secondary {
  background: #edf2f6;
  color: var(--text);
}

.btn-danger {
  background: #fff0ef;
  color: var(--red);
}

.btn-small {
  padding: 8px 12px;
  font-size: 11px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 7px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  outline: none;
  background: white;
  color: var(--text);
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--green);
}

.field textarea {
  min-height: 105px;
  resize: vertical;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}

th, td {
  text-align: left;
  padding: 14px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

th {
  color: var(--muted);
  font-weight: 700;
  background: #fafbfd;
}

.empty {
  text-align: center;
  padding: 35px;
  color: var(--muted);
  font-size: 13px;
}

.note {
  border-left: 3px solid var(--green);
  padding: 12px 15px;
  background: #f8fafb;
  border-radius: 0 9px 9px 0;
  margin-bottom: 12px;
}

.note strong {
  font-size: 12px;
}

.note small {
  color: var(--muted);
  display: block;
  font-size: 10px;
  margin: 5px 0;
}

.note p {
  font-size: 12px;
  line-height: 1.5;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(8, 19, 30, .7);
  display: grid;
  place-items: center;
  padding: 15px;
  overflow-y: auto;
}

.modal {
  background: white;
  width: min(650px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 18px;
  padding: 25px;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
  margin-bottom: 20px;
}

.modal-head h2 {
  font-size: 20px;
}

.close-btn {
  background: #edf1f4;
  border: 0;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 18px;
}

.lesson-content {
  background: #f7f9fb;
  padding: 17px;
  border-radius: 10px;
  margin: 15px 0;
  font-size: 13px;
  line-height: 1.8;
}

.lesson-content ul {
  padding-left: 20px;
  margin-top: 10px;
}

.question {
  border-top: 1px solid var(--border);
  padding: 17px 0;
}

.question strong {
  display: block;
  font-size: 13px;
  margin-bottom: 12px;
}

.option {
  display: flex;
  gap: 9px;
  font-size: 12px;
  padding: 8px 0;
  cursor: pointer;
}

.quiz-result {
  margin-top: 15px;
  font-weight: 700;
  font-size: 13px;
}

footer {
  padding: 20px 30px;
  color: var(--muted);
  font-size: 10px;
  text-align: center;
}


.unit-summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.unit-summary-item {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  background: #fafcfd;
  min-width: 0;
}
.unit-summary-code {
  font-size: 10px;
  color: var(--green);
  font-weight: 800;
  margin-bottom: 7px;
}
.unit-summary-item strong {
  display: block;
  font-size: 12px;
}
.unit-summary-metrics {
  display: grid;
  gap: 7px;
  margin-top: 12px;
  font-size: 10px;
  color: var(--muted);
}
.unit-summary-metrics b {
  color: var(--text);
  font-size: 12px;
  margin-right: 4px;
}
@media(max-width: 900px) {
  .unit-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media(max-width: 900px) {
  .sidebar {
    width: 190px;
  }
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 650px) {
  .app {
    display: block;
  }
  .sidebar {
    width: 100%;
    padding: 12px;
  }
  .brand {
    padding: 5px 8px 12px;
  }
  .nav-label, .side-footer {
    display: none;
  }
  .sidebar nav {
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }
  .nav-btn {
    white-space: nowrap;
    padding: 10px;
    font-size: 11px;
  }
  .topbar {
    padding: 16px;
    align-items: flex-start;
  }
  .topbar h1 {
    font-size: 18px;
  }
  .top-actions select {
    max-width: 125px;
    font-size: 10px;
  }
  main {
    padding: 16px;
  }
  .welcome {
    padding: 22px;
  }
  .welcome h2 {
    font-size: 20px;
  }
  .welcome-mark {
    display: none;
  }
  .stats {
    gap: 10px;
  }
  .stat-card {
    padding: 14px;
  }
  .stat-number {
    font-size: 24px;
  }
  .grid-2, .module-grid, .form-grid {
    grid-template-columns: 1fr;
  }
}

.demo-login-root {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  overflow-y: auto;
  place-items: center;
  padding: 24px;
  background: linear-gradient(135deg,#101c2b,#203c50);
}

body.demo-locked .app {
  display: none !important;
}

body.demo-locked #demoLoginRoot {
  display: grid;
}

.demo-login-card {
  width: min(440px,100%);
  background: white;
  padding: 34px;
  border-radius: 20px;
  box-shadow: 0 20px 70px #0005;
}

.demo-login-brand {
  width: 54px;
  height: 54px;
  border-radius: 15px;
  background: var(--green);
  color: white;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 22px;
}

.demo-login-card h1 {
  font-size: 29px;
  color: var(--navy);
  margin: 8px 0;
}

.demo-login-subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 25px;
}

.demo-login-card label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin: 15px 0 7px;
}

.demo-login-card input,
.demo-login-card select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-size: 13px;
}

.demo-login-button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: var(--green);
  color: white;
  border: 0;
  border-radius: 9px;
  font-weight: 800;
}

.demo-login-hint {
  margin-top: 22px;
  padding: 14px;
  background: var(--green-light);
  border-radius: 10px;
  font-size: 11px;
  line-height: 1.9;
  color: var(--text);
}

.demo-login-error {
  color: #b54747;
  font-size: 12px;
  margin-top: 12px;
}

.demo-login-warning {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  margin-top: 18px;
}

.demo-session-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
}

@media(max-width: 500px) {
  .demo-login-card { padding: 24px; }
  .demo-session-label { display: none; }
}

</style>
</head>

const MODULE_CODES = {
  1: "boas-vindas-cultura",
  2: "seguranca-alimentar",
  3: "preparo-cozinha",
  4: "atendimento-cliente",
  5: "operacao-caixa",

};

function throwIfError(result, context) {
  if (result.error) {
    console.error(context, result.error);
    throw new Error(context + ": " + result.error.message);
  }
  return result.data;
}

async function loadData() {
  const unitResult = await supabaseClient
    .from("units")
    .select("id, code, name, city, state, is_active")
    .eq("is_active", true)
    .order("name");

  units = throwIfError(unitResult, "Nao foi possivel carregar as unidades") || [];
  if (!units.length) {
    throw new Error("Nenhuma unidade encontrada. Execute primeiro o arquivo trilha_vv_supabase_demo.sql no SQL Editor do Supabase.");
  }

  const moduleResult = await supabaseClient
    .from("training_modules")
    .select("id, code, title, target_role, description, duration_minutes, icon, topics, quiz, sort_order, is_active")
    .eq("is_active", true)
    .order("sort_order");

  const moduleRows = throwIfError(moduleResult, "Nao foi possivel carregar os treinamentos") || [];
  if (!moduleRows.length) {
    throw new Error("Nenhum treinamento encontrado. Confira se os seis modulos foram inseridos no Supabase.");
  }

  moduleDbIds = {};
  const localIdByCode = Object.fromEntries(
    Object.entries(MODULE_CODES).map(([id, code]) => [code, Number(id)])
  );

  moduleRows.forEach(row => {
    const localId = localIdByCode[row.code];
    if (!localId) return;
    moduleDbIds[localId] = row.id;
    const localModule = MODULES.find(module => module.id === localId);
    if (localModule) {
      localModule.dbId = row.id;
      localModule.title = row.title;
      localModule.role = row.target_role;
      localModule.description = row.description || "";
      localModule.duration = `${row.duration_minutes || 15} minutos`;
      localModule.icon = row.icon || "📘";
      localModule.topics = Array.isArray(row.topics) ? row.topics : [];
      localModule.quiz = Array.isArray(row.quiz) ? row.quiz : [];
    }
  });

  const missingModules = Object.keys(MODULE_CODES).filter(id => !moduleDbIds[Number(id)]);
  if (missingModules.length) {
    throw new Error("Faltam modulos no banco. Execute novamente o SQL de configuracao demonstrativa.");
  }

  let employeeResult = await supabaseClient
    .from("employees")
    .select("id, full_name, role, unit_id, admission_date, mentor_name, status")
    .eq("status", "active")
    .order("created_at");

  let employeeRows = throwIfError(employeeResult, "Nao foi possivel carregar os colaboradores") || [];

  // Insere dois colaboradores ficticios uma unica vez, somente se o banco estiver vazio.
  if (employeeRows.length === 0) {
    const demoEmployees = [
      {
        full_name: "Ana Souza (DEMO)",
        role: "Auxiliar de cozinha",
        unit_id: units[0].id,
        admission_date: "2026-11-10",
        mentor_name: "Chef Marcos (DEMO)",
        status: "active"
      },
      {
        full_name: "Carlos Lima (DEMO)",
        role: "Atendente",
        unit_id: (units[1] || units[0]).id,
        admission_date: "2026-11-15",
        mentor_name: "Mariana (DEMO)",
        status: "active"
      }
    ];
    const seedResult = await supabaseClient.from("employees").insert(demoEmployees);
    throwIfError(seedResult, "Nao foi possivel criar os colaboradores ficticios");

    employeeResult = await supabaseClient
      .from("employees")
      .select("id, full_name, role, unit_id, admission_date, mentor_name, status")
      .eq("status", "active")
      .order("created_at");
    employeeRows = throwIfError(employeeResult, "Nao foi possivel recarregar os colaboradores") || [];
  }

  const progressResult = await supabaseClient
    .from("employee_progress")
    .select("employee_id, module_id, status, score, attempts");
  const progressRows = throwIfError(progressResult, "Nao foi possivel carregar o progresso") || [];

  const notesResult = await supabaseClient
    .from("mentoring_notes")
    .select("id, employee_id, author_name, note_text, created_at")
    .order("created_at");
  const noteRows = throwIfError(notesResult, "Nao foi possivel carregar os acompanhamentos") || [];

  const unitById = Object.fromEntries(units.map(unit => [unit.id, unit]));
  const localIdByDbId = Object.fromEntries(
    Object.entries(moduleDbIds).map(([localId, dbId]) => [dbId, Number(localId)])
  );

  db.employees = employeeRows.map(row => {
    const employeeProgress = progressRows.filter(p => p.employee_id === row.id);
    const employeeNotes = noteRows.filter(n => n.employee_id === row.id);
    return {
      id: row.id,
      name: row.full_name,
      role: row.role,
      unit_id: row.unit_id,
      unit: unitById[row.unit_id]?.name || "Unidade nao identificada",
      start: row.admission_date || "",
      mentor: row.mentor_name || "",
      completedModules: employeeProgress
        .filter(p => p.status === "completed")
        .map(p => localIdByDbId[p.module_id])
        .filter(Boolean),
      notes: employeeNotes.map(note => ({
        id: note.id,
        author: note.author_name || "Responsavel",
        text: note.note_text,
        date: new Date(note.created_at).toLocaleString("pt-BR")
      }))
    };
  });

  if (!activeEmployeeId || !db.employees.some(e => e.id === activeEmployeeId)) {
    activeEmployeeId = db.employees[0]?.id ?? null;
  }
  return db;
}

function getEmployee(id = activeEmployeeId) {
  return db.employees.find(e => String(e.id) === String(id));
}

function getEligibleModules(employee) {
  if (!employee) return [];
  return MODULES.filter(m =>
    m.role === "Todos os cargos" || m.role === employee.role
  );
}

function getProgress(employee) {
  if (!employee) return 0;
  const modules = getEligibleModules(employee);
  if (!modules.length) return 0;

  const completed = modules.filter(m =>
    (employee.completedModules || []).includes(m.id)
  ).length;

  return Math.round((completed / modules.length) * 100);
}



function getUnitMetrics(unit) {
  const employees = getScopedEmployees().filter(
    e => e.unit_id === unit.id
  );

  const completedTrails = employees.filter(
    e => getProgress(e) === 100
  ).length;

  const completedModules = employees.reduce(
    (sum, e) => sum + (e.completedModules || []).length, 0
  );

  const notes = employees.reduce(
    (sum, e) => sum + (e.notes || []).length, 0
  );

  const average = employees.length
    ? Math.round(employees.reduce(
        (sum, e) => sum + getProgress(e), 0
      ) / employees.length)
    : 0;

  return {
    unit, employees, completedTrails,
    completedModules, notes, average
  };
}

function getScopedEmployees() {
  if (!demoSession) return db.employees;

  if (demoSession.role === "manager") {
    return db.employees.filter(
      e => String(e.unit_id) === String(demoSession.unitId)
    );
  }

  if (demoSession.role === "employee") {
    return db.employees.filter(
      e => String(e.id) === String(demoSession.employeeId)
    );
  }

  return db.employees;
}

function getScopedUnits() {
  if (!demoSession) return units;

  if (demoSession.role === "manager") {
    return units.filter(
      u => String(u.id) === String(demoSession.unitId)
    );
  }

  if (demoSession.role === "employee") {
    const employee = db.employees.find(
      e => String(e.id) === String(demoSession.employeeId)
    );
    return employee
      ? units.filter(u => String(u.id) === String(employee.unit_id))
      : [];
  }

  return units;
}

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function progressHTML(progress) {
  return `
    <div class="progress-track">
      <div class="progress-fill" style="width:${progress}%"></div>
    </div>
  `;
}

function formatDate(date) {
  if (!date) return "Não informado";
  return new Date(date + "T12:00:00").toLocaleDateString("pt-BR");
}

function emptyMessage(message) {
  return `<div class="empty">${escapeHTML(message)}</div>`;
}

  const completedModules = getScopedEmployees().reduce(
    (sum, e) => sum + (e.completedModules || []).length, 0
  );

  const average = total
    ? Math.round(getScopedEmployees().reduce(
        (sum, e) => sum + getProgress(e), 0
      ) / total)
    : 0;

  const feedbackTotal = getScopedEmployees().reduce(

  if (!demoSession) { showDemoLogin(); return; }
  if (!canDemoAccessPage(activePage)) activePage = 'dashboard';
  document.getElementById("pageTitle").textContent = pageTitles[activePage];

  const picker = document.getElementById("employeePicker");

  picker.innerHTML = getScopedEmployees().length
    ? getScopedEmployees().map(e => `
        <option value="${e.id}">${escapeHTML(e.name)}</option>

    : `<option value="">Nenhum colaborador</option>`;

  if (!scopedEmployees.some(e => String(e.id) === String(activeEmployeeId))) {
    activeEmployeeId = scopedEmployees[0]?.id ?? null;
  }

  if (activeEmployeeId) picker.value = activeEmployeeId;
  picker.hidden = demoSession.role === "employee";

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.hidden = !canDemoAccessPage(btn.dataset.page);

  });

  const view = document.getElementById("view");

  switch (activePage) {
    case "dashboard":
      view.innerHTML = renderDashboard();
      break;
    case "trilhas":
      view.innerHTML = renderModules();
      break;
    case "colaboradores":
      view.innerHTML = renderEmployees();
      break;
    case "acompanhamento":
      view.innerHTML = renderMentoring();
      break;
    case "relatorios":
      view.innerHTML = renderReports();
      break;
    default:
      view.innerHTML = renderDashboard();
  }

  view.querySelectorAll("[data-page]").forEach(el => {

  const sessionLabel = document.getElementById("demoSessionLabel");

}

function openModule(id) {
  const module = MODULES.find(m => m.id === Number(id));
  const employee = getEmployee();

  if (!module || !employee) {
    alert("Selecione um colaborador antes de iniciar o treinamento.");
    return;
  }

  const allowed = getEligibleModules(employee).some(m => m.id === module.id);

  if (!allowed) {
    alert("Este módulo não está disponível para o cargo selecionado.");
    return;
  }

  const done = (employee.completedModules || []).includes(module.id);

  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <section class="modal">
        <div class="modal-head">
          <div>
            <div class="eyebrow">MÓDULO DE CAPACITAÇÃO</div>
            <h2 style="margin-top:7px">${escapeHTML(module.title)}</h2>
            <p style="font-size:11px;color:var(--muted);margin-top:6px">${escapeHTML(module.duration)}</p>
          </div>
          <button class="close-btn" data-action="close-modal">×</button>
        </div>

        ${done ? `<span class="tag">Módulo já concluído</span>` : ""}

        <p style="font-size:13px;line-height:1.7;margin-bottom:10px">
          ${escapeHTML(module.description)}
        </p>

        <div class="lesson-content">
          <strong>Conteúdo do treinamento</strong>
          <ul>
            ${module.topics.map(t => `<li>${escapeHTML(t)}</li>`).join("")}
          </ul>
        </div>

        <div class="section-title">
          <div>
            <h2>Avaliação de aprendizagem</h2>
            <p>Responda às questões para registrar a conclusão.</p>
          </div>
        </div>

        <form id="quizForm" data-module="${module.id}">
          ${module.quiz.map((q, index) => `
            <div class="question">
              <strong>${index + 1}. ${escapeHTML(q.question)}</strong>
              ${q.options.map((option, optionIndex) => `
                <label class="option">
                  <input type="radio" name="q${index}" value="${optionIndex}" required>
                  ${escapeHTML(option)}
                </label>
              `).join("")}
            </div>
          `).join("")}

          <button type="submit" class="btn">Corrigir avaliação</button>
        </form>

        <div id="quizResult" class="quiz-result"></div>
      </section>
    </div>
  `;
}

document.addEventListener("click", async event => {

  const nav = event.target.closest("[data-page]");

  if (nav) {
    if (!canDemoAccessPage(nav.dataset.page)) return;
    activePage = nav.dataset.page;
    render();
    return;
  }

  const actionButton = event.target.closest("[data-action]");

  if (!actionButton) return;

  const action = actionButton.dataset.action;
  const id = actionButton.dataset.id;

  if (action === "demo-logout") {
    demoSession = null;
    activeEmployeeId = null;
    activePage = "dashboard";
    document.getElementById("modalRoot").innerHTML = "";
    showDemoLogin();
    return;
  }

  if (action === "refresh-dashboard") {
    await refreshFromSupabase();
    return;
  }

  if (action === "open-module") {
    openModule(id);
  }

  if (action === "close-modal") {
    document.getElementById("modalRoot").innerHTML = "";
  }

  if (action === "delete-employee") {
    if (!confirm("Deseja excluir este colaborador e seus registros?")) return;

    const deleteResult = await supabaseClient.from("employees").delete().eq("id", id);
    if (deleteResult.error) {
      alert("Nao foi possivel excluir: " + deleteResult.error.message);
      return;
    }
    if (String(activeEmployeeId) === String(id)) activeEmployeeId = null;
    await refreshFromSupabase();
  }

  if (action === "export") {
    const content = JSON.stringify(db, null, 2);
    const blob = new Blob([content], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "backup-trilha-vv.json";
    link.click();

    URL.revokeObjectURL(url);
  }
});

document.getElementById("employeePicker").addEventListener("change", event => {
  if (!demoSession || demoSession.role === "employee") return;

  const selected = getScopedEmployees().find(
    e => String(e.id) === String(event.target.value)
  );

  if (!selected) return;

  activeEmployeeId = selected.id;
  render();
});

document.addEventListener("click", event => {
  if (event.target.id === "modalBackdrop") {
    document.getElementById("modalRoot").innerHTML = "";
  }
});

document.addEventListener("submit", async event => {

  if (event.target.id === "demoLoginForm") {
    event.preventDefault();

    const form = new FormData(event.target);
    const role = String(form.get("profile") || "");
    const username = String(form.get("username") || "").trim().toLowerCase();
    const password = String(form.get("password") || "");

    const labels = {
      admin: "Administrador",
      manager: "Gerente",
      employee: "Colaborador"
    };

    const error = document.getElementById("demoLoginError");

    const unitId = form.get("unitId");
    const employeeId = form.get("employeeId");

    if (role === "manager" && !unitId) {
      error.textContent = "Selecione uma unidade.";
      return;
    }

    if (role === "employee" && !employeeId) {
      error.textContent = "Selecione um colaborador.";
      return;
    }

    const selectedEmployee = role === "employee"
      ? db.employees.find(e => String(e.id) === String(employeeId))
      : null;

    if (role === "employee" && !selectedEmployee) {
      error.textContent = "Colaborador nao encontrado.";
      return;
    }

    const selectedUnit = units.find(
      u => String(u.id) === String(unitId)
    );

    demoSession = {
      role,
      roleLabel: labels[role],
      unitId: role === "manager" ? unitId : null,
      employeeId: role === "employee" ? employeeId : null,
      displayName: role === "admin"
        ? "Todas as unidades"
        : role === "manager"
          ? (selectedUnit?.name || "Unidade")
          : selectedEmployee.name
    };

    if (role === "employee") {
      activeEmployeeId = selectedEmployee.id;
    } else if (role === "manager") {
      activeEmployeeId = getScopedEmployees()[0]?.id ?? null;
    } else {
      activeEmployeeId = db.employees[0]?.id ?? null;
    }

    activePage = "dashboard";
    document.body.classList.remove("demo-locked");
    document.getElementById("demoLoginRoot").innerHTML = "";
    render();
    return;
  }

  // Cadastro de colaborador
  if (event.target.id === "addEmployeeForm") {
    event.preventDefault();

    const form = new FormData(event.target);

    const employeePayload = {
      full_name: String(form.get("name") || "").trim(),
      role: form.get("role"),
      unit_id: form.get("unit_id"),
      admission_date: form.get("start") || null,
      mentor_name: String(form.get("mentor") || "").trim() || null,
      status: "active"
    };
    const insertResult = await supabaseClient
      .from("employees")
      .insert(employeePayload)
      .select("id")
      .single();
    if (insertResult.error) {
      alert("Nao foi possivel cadastrar: " + insertResult.error.message);
      return;
    }
    activeEmployeeId = insertResult.data.id;
    await loadData();
    activePage = "colaboradores";
    render();
    alert("Colaborador cadastrado no Supabase!");
  }

  // Registro de feedback
  if (event.target.id === "noteForm") {
    event.preventDefault();

    const employee = getEmployee();
    if (!employee) return;

    const form = new FormData(event.target);
    const text = form.get("note").trim();

    if (!text) return;

    employee.notes = employee.notes || [];

    const noteResult = await supabaseClient
      .from("mentoring_notes")
      .insert({
        employee_id: employee.id,
        author_name: employee.mentor || "Responsavel (DEMO)",
        note_text: text
      });
    if (noteResult.error) {
      alert("Nao foi possivel salvar o acompanhamento: " + noteResult.error.message);
      return;
    }
    await refreshFromSupabase();
    alert("Acompanhamento registrado no Supabase!");
  }

  // Correção da avaliação
  if (event.target.id === "quizForm") {
    event.preventDefault();

    const moduleId = Number(event.target.dataset.module);
    const module = MODULES.find(m => m.id === moduleId);
    const employee = getEmployee();

    if (!module || !employee) return;

    const form = new FormData(event.target);

    let correct = 0;

    for (let i = 0; i < module.quiz.length; i++) {
      const answer = form.get("q" + i);

      if (answer === null) {
        document.getElementById("quizResult").textContent =
          "Responda todas as questões antes de corrigir.";
        return;
      }

      if (Number(answer) === module.quiz[i].answer) {
        correct++;
      }
    }

    const score = Math.round((correct / module.quiz.length) * 100);
    const result = document.getElementById("quizResult");

    if (score >= 70) {
      const databaseModuleId = moduleDbIds[module.id];
      if (!databaseModuleId) {
        result.style.color = "#c47a20";
        result.textContent = "Este treinamento ainda nao esta vinculado ao banco.";
        return;
      }
      const previousResult = await supabaseClient
        .from("employee_progress")
        .select("attempts, started_at")
        .eq("employee_id", employee.id)
        .eq("module_id", databaseModuleId)
        .maybeSingle();
      if (previousResult.error) {
        result.style.color = "#c47a20";
        result.textContent = "Erro ao consultar tentativas: " + previousResult.error.message;
        return;
      }
      const previous = previousResult.data;
      const now = new Date().toISOString();
      const answers = {};
      for (let i = 0; i < module.quiz.length; i++) answers["q" + i] = Number(form.get("q" + i));

      const attemptInsert = await supabaseClient.from("quiz_attempts").insert({
        employee_id: employee.id,
        module_id: databaseModuleId,
        correct_answers: correct,
        total_questions: module.quiz.length,
        score,
        passed: true,
        answers
      });
      if (attemptInsert.error) {
        result.style.color = "#c47a20";
        result.textContent = "Erro ao salvar avaliacao: " + attemptInsert.error.message;
        return;
      }

      const progressSave = await supabaseClient.from("employee_progress").upsert({
        employee_id: employee.id,
        module_id: databaseModuleId,
        status: "completed",
        score,
        attempts: (previous?.attempts || 0) + 1,
        started_at: previous?.started_at || now,
        completed_at: now,
        updated_at: now
      }, { onConflict: "employee_id,module_id" });
      if (progressSave.error) {
        result.style.color = "#c47a20";
        result.textContent = "A avaliacao foi salva, mas houve erro no progresso: " + progressSave.error.message;
        return;
      }

      await loadData();
      render();
      result.style.color = "#16835f";
      result.textContent = `Aprovado! Voce acertou ${correct} de ${module.quiz.length} questoes (${score}%). Conclusao registrada no banco.`;
    } else {
      const databaseModuleId = moduleDbIds[module.id];
      if (!databaseModuleId) {
        result.style.color = "#c47a20";
        result.textContent = "Este treinamento ainda nao esta vinculado ao banco.";
        return;
      }
      const previousResult = await supabaseClient
        .from("employee_progress")
        .select("attempts, started_at")
        .eq("employee_id", employee.id)
        .eq("module_id", databaseModuleId)
        .maybeSingle();
      if (previousResult.error) {
        result.style.color = "#c47a20";
        result.textContent = "Erro ao consultar tentativas: " + previousResult.error.message;
        return;
      }
      const previous = previousResult.data;
      const now = new Date().toISOString();
      const answers = {};
      for (let i = 0; i < module.quiz.length; i++) answers["q" + i] = Number(form.get("q" + i));

      const attemptInsert = await supabaseClient.from("quiz_attempts").insert({
        employee_id: employee.id,
        module_id: databaseModuleId,
        correct_answers: correct,
        total_questions: module.quiz.length,
        score,
        passed: false,
        answers
      });
      if (attemptInsert.error) {
        result.style.color = "#c47a20";
        result.textContent = "Erro ao salvar avaliacao: " + attemptInsert.error.message;
        return;
      }

      const progressSave = await supabaseClient.from("employee_progress").upsert({
        employee_id: employee.id,
        module_id: databaseModuleId,
        status: "in_progress",
        score,
        attempts: (previous?.attempts || 0) + 1,
        started_at: previous?.started_at || now,
        completed_at: null,
        updated_at: now
      }, { onConflict: "employee_id,module_id" });
      if (progressSave.error) {
        result.style.color = "#c47a20";
        result.textContent = "A avaliacao foi salva, mas houve erro no progresso: " + progressSave.error.message;
        return;
      }

      await loadData();
      render();
      result.style.color = "#c47a20";
      result.textContent = `Voce acertou ${correct} de ${module.quiz.length} questoes (${score}%). E necessario atingir 70%. Resultado registrado; revise o conteudo e tente novamente.`;
    }
  }
});

initializeApp();
